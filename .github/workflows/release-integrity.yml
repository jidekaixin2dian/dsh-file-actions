name: Release integrity
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published version tag to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Test the integrity checker
        run: python3 scripts/test-release-integrity.py
      - name: Verify published archive against its tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 scripts/verify-release.py --download --tag "$RELEASE_TAG"
