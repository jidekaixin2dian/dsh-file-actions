name: npm publish

# Manual publish with provenance: run from Actions after bumping the version.
# Requires the NPM_TOKEN repo secret (granular token, publish rights for this
# package). id-token: write lets npm attach the OIDC provenance statement.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.1'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
