name: Validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm test
      - run: npm run pack:check
  host:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm install --global pnpm@11.28.5 --ignore-scripts
      - run: npm run setup:host
      - if: runner.os == 'Linux'
        run: npx --no-install playwright install --with-deps chromium
      - name: Host filesystem and browser regression
        run: npm run test:host
        env:
          DFA_RESULTS: work/results/rc5
      - name: Prepare rc.4 compatibility host
        run: npm run setup:host
        env:
          DFA_HOST_VERSION: rc.4
      - name: rc.4 filesystem and browser regression
        run: npm run test:host
        env:
          DFA_HOST_VERSION: rc.4
          DFA_RESULTS: work/results/rc4
      - name: Prepare minimum supported host
        run: npm run setup:host
        env:
          DFA_HOST_VERSION: rc.2
      - name: Minimum host filesystem and browser regression
        run: npm run test:host
        env:
          DFA_HOST_VERSION: rc.2
          DFA_RESULTS: work/results/rc2
      - name: Prepare previous supported host
        run: npm run setup:host
        env:
          DFA_HOST_VERSION: rc.3
      - name: Previous host filesystem and browser regression
        run: npm run test:host
        env:
          DFA_HOST_VERSION: rc.3
          DFA_RESULTS: work/results/rc3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: host-${{ matrix.os }}
          path: work/results/
